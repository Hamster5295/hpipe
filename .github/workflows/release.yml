name: rtl release

on:
 push:
   tags:
     - 'v*'
jobs:
 release:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Verilator
      run: |
        sudo apt-get install verilator
        verilator --version
    - name: Setup RISCV GNU Toolchain
      uses: Hamster5295/riscv-toolchain-setup@v1
      with:
        version: '2026.03.28'
        arch: riscv64
        libc: elf
        compiler: gcc
        os: ubuntu-24.04
    - name: Build
      run: |
        make verilog
        mv build hpipe_${{ github.ref_name }}
        tar -cvzf hpipe_${{ github.ref_name }}.tar.gz hpipe_${{ github.ref_name }}
    - name: Test
      run: make sim APP=rv-tests
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: hpipe_${{ github.ref_name }}.tar.gz
        token: ${{ secrets.RELEASE }}