name: rv-test

on:
  push:
    tags: ['*']
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Cache Scala
        uses: coursier/cache-action@v6
      - name: Setup Scala
        uses: coursier/setup-action@v1
        with:
          jvm: adopt:11
          apps: sbt
      - name: Setup Verilator
        run: |
          sudo apt-get install verilator
          verilator --version
      - name: Setup RISCV GNU Toolchain
        uses: Hamster5295/riscv-toolchain-setup@v1
        with:
          version: 'latest'
          arch: riscv64
          libc: elf
          compiler: gcc
          os: ubuntu-24.04
      - name: mill Test
        run: make sim APP=rv-tests
